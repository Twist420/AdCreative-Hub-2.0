<!doctype html>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>

        theme: {
          extend: {
            colors: {
              primary: '#4f46e5',
              secondary: '#64748b',
              background: '#f8fafc',
              surface: '#ffffff',

            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }

      .border-emerald-150 { border-color: #bbf7d0; }
      .border-rose-150 { border-color: #fecdd3; }
      .border-orange-150 { border-color: #fed7aa; }
      .border-amber-150 { border-color: #fde68a; }
      .border-sky-150 { border-color: #bae6fd; }
      .text-slate-350 { color: #a8b4c4; }
      .text-slate-450 { color: #8794a8; }
      .text-slate-550 { color: #58677d; }
      .text-slate-650 { color: #3f4d63; }

              <div class="flex items-center gap-1 text-slate-600">

              <div class="grid grid-cols-1 min-[520px]:grid-cols-2 gap-2 text-slate-600 min-[440px]:col-span-2">

                  <span class="font-semibold text-slate-400 shrink-0">截止:</span>
                  <span class="font-mono font-bold text-slate-650 bg-white px-1.5 py-0.5 rounded border border-slate-100 flex-1 text-[10px] text-center">2026-07-01</span>

                  </span>
                  <span class="text-slate-500 font-bold ml-1 font-sans shrink-0">

                <span class="flex items-center gap-0.5 text-blue-550 font-sans shrink-0"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>进行中:1</span>

                <span class="shrink-0 rounded-md border px-1.5 py-0.5 text-[9px] font-black font-mono shadow-3xs transition-all hover:scale-105 bg-slate-50 text-slate-550 border-slate-150">cp3357</span>
              </div>
              <button type="button" class="relative z-20 inline-flex h-[34px] shrink-0 items-center justify-center gap-1.5 rounded-lg px-3 text-[10px] font-black whitespace-nowrap transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-600/20 ring-1 ring-indigo-500 hover:bg-slate-950 hover:ring-slate-950 hover:-translate-y-0.5" title="新建需求">
